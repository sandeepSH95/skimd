<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E7EC"/>
    </linearGradient>
    <linearGradient id="crossbar-fill" gradientUnits="userSpaceOnUse"
                    x1="430" y1="352" x2="590" y2="672">
      <stop offset="0" stop-color="#EEF0F4"/>
      <stop offset="1" stop-color="#D3D8DF"/>
    </linearGradient>
  </defs>

  <g id="tile">
    <rect x="100" y="100" width="824" height="824" rx="186"
          fill="url(#tile-fill)" filter="url(#tile-shadow)"/>
  </g>

  <g id="glyph" transform="translate(512 512) scale(0.8) translate(-512 -512) translate(93.12 0) skewX(-10.31)">
    <g id="horizontals" fill="url(#crossbar-fill)">
      <rect x="262.95" y="372.2" width="498.1" height="97.5" rx="2"/>
      <rect x="262.95" y="554.7" width="498.1" height="97.5" rx="2"/>
    </g>
    <g id="verticals" fill="#1A1A1A">
      <rect x="350.6" y="192" width="97.5" height="640" rx="2"/>
      <rect x="575.7" y="192" width="97.5" height="640" rx="2"/>
    </g>
  </g>
</svg>
